name: Qodo Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, hackathon/* ]
    paths:
      - 'backend/app/engine/**'
      - 'backend/app/execution/**'
      - 'backend/app/models/**'
      - 'backend/app/storage/**'
      - 'mcp/financial_server/**'

jobs:
  qodo-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodo PR Agent Security Review
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI__KEY: ${{ secrets.OPENAI_KEY || secrets.QODO_API_KEY || secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
          OPENAI__API_BASE: "https://openrouter.ai/api/v1"
          OPENAI__MODEL: "openai/gpt-4o-mini"
